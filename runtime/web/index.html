<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tege2DeV</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f5f7; --panel:#fff; --text:#202124; --muted:#6c727f; --line:#d9dde4; --accent:#1769aa; --user:#e7f1fb; --agent:#fff; --activity:#f7f8fa; }
    @media (prefers-color-scheme:dark) { :root { --bg:#151719; --panel:#202326; --text:#edf0f2; --muted:#a8afb8; --line:#3b4046; --accent:#64b5f6; --user:#20384b; --agent:#202326; --activity:#191c1f; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui,sans-serif; }
    main { width:100%; height:100dvh; display:grid; grid-template-rows:auto 1fr auto; background:var(--panel); }
    header { display:flex; align-items:center; gap:12px; min-height:56px; padding:10px 16px; border-bottom:1px solid var(--line); }
    h1 { margin:0; font-size:18px; font-weight:650; }
    nav { display:flex; align-self:stretch; gap:4px; }
    .tab { width:auto; padding:0 10px; border:0; border-bottom:2px solid transparent; border-radius:0; background:transparent; color:var(--muted); cursor:pointer; font-size:14px; }
    .tab.active { border-bottom-color:var(--accent); color:var(--text); }
    #connection-status { display:flex; align-items:center; gap:14px; margin-left:auto; white-space:nowrap; color:var(--muted); font-size:13px; }
    #settings { display:flex; gap:8px; align-items:center; }
    input,textarea,button,select { font:inherit; color:inherit; }
    input,textarea,select { border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:9px 10px; }
    #project { width:190px; }
    #project-add, #project-delete, #files-upload, #files-refresh { height:36px; padding:0; border:1px solid var(--line); border-radius:6px; background:var(--panel); cursor:pointer; line-height:1; }
    #project-add, #files-upload, #files-refresh { width:36px; font-size:20px; }
    #project-delete, #project-rename { width:auto; padding:0 10px; font-size:13px; white-space:nowrap; flex-shrink:0; }
    #project-rename { height:36px; border:1px solid var(--line); border-radius:6px; background:var(--panel); cursor:pointer; }
    #chat { min-height:0; overflow:hidden; }
    #chat { display:grid; grid-template-columns:230px minmax(0,1fr); }
    #file-panel { min-width:0; overflow:auto; border-right:1px solid var(--line); background:var(--activity); }
    .file-toolbar { position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; min-height:48px; padding:6px 10px 6px 14px; border-bottom:1px solid var(--line); background:var(--activity); }
    .file-toolbar strong { font-size:13px; }
    .file-actions { display:flex; gap:6px; }
    #file-tree { padding:8px 14px 18px 6px; font-size:13px; }
    #file-tree details { margin:0; }
    #file-tree summary, .file-entry { min-height:28px; padding:4px 6px; overflow-wrap:anywhere; display:grid; grid-template-columns:auto 16px minmax(0,1fr) 80px; align-items:center; column-gap:7px; }
    #file-tree summary { cursor:pointer; }
    #file-tree summary::-webkit-details-marker { display:none; }
    #file-tree summary::before { content:""; width:6px; height:6px; border-right:1.5px solid currentColor; border-bottom:1.5px solid currentColor; transform:rotate(-45deg); }
    #file-tree details[open] > summary::before { transform:rotate(45deg); }
    #file-tree details > :not(summary) { margin-left:13px; }
    .file-entry { width:100%; border:0; border-radius:4px; background:transparent; color:var(--muted); text-align:left; cursor:pointer; }
    .file-entry::before { content:""; grid-column:1; }
    .tree-icon { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    #file-tree summary .tree-icon { color:var(--accent); }
    #file-tree summary span, .file-entry span { min-width:0; overflow-wrap:anywhere; }
    .tree-mtime { text-align:right; font:11px/1.4 ui-monospace,monospace; color:var(--muted); }
    .file-entry:hover { background:var(--line); color:var(--text); }
    #messages { min-width:0; overflow:auto; padding:20px clamp(12px,4vw,32px); }
    .message { max-width:78%; margin:0 0 16px; padding:10px 13px; border:1px solid var(--line); border-radius:8px; white-space:pre-wrap; overflow-wrap:anywhere; }
    .user { margin-left:auto; background:var(--user); }
    .agent { background:var(--agent); }
    .message a { color:#79c7ff; text-decoration:underline; }
    .activity { max-width:90%; margin:0 0 14px; border-left:3px solid var(--accent); background:var(--activity); padding:9px 12px; color:var(--muted); }
    .activity summary { cursor:pointer; color:var(--text); }
    .steps { margin:8px 0 0; padding:0; list-style:none; font:13px/1.5 ui-monospace,monospace; }
    .steps li { padding:3px 0; border-top:1px solid var(--line); overflow-wrap:anywhere; }
    .empty { padding:32px 16px; color:var(--muted); text-align:center; }
    form { display:grid; grid-template-columns:1fr auto; gap:10px; padding:12px 16px; border-top:1px solid var(--line); }
    textarea { resize:none; min-height:46px; max-height:140px; }
    #send { width:46px; border:0; border-radius:6px; background:var(--accent); color:white; cursor:pointer; font-size:20px; }
    #send.stop { background:#b3261e; font-size:16px; }
    dialog { width:min(420px,calc(100% - 32px)); border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text); padding:18px; }
    dialog::backdrop { background:rgba(0,0,0,.45); }
    dialog h2 { margin:0 0 14px; font-size:17px; }
    #project-create-form { display:grid; grid-template-columns:1fr; gap:12px; padding:0; border:0; }
    #project-name { width:100%; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:8px; }
    .dialog-actions button { min-height:36px; padding:0 14px; border:1px solid var(--line); border-radius:6px; background:var(--panel); cursor:pointer; }
    #project-create { background:var(--accent); color:#fff; border-color:var(--accent); }
    #project-delete-confirm { background:#b3261e; color:#fff; border-color:#b3261e; }
    #project-error, #project-delete-error { min-height:1.5em; color:#c62828; font-size:13px; }
    #file-dialog { width:calc(100% - 32px); height:calc(100% - 32px); max-width:none; max-height:none; padding:0; overflow:hidden; }
    .file-dialog-head { display:flex; align-items:center; gap:12px; min-height:48px; padding:7px 10px 7px 16px; border-bottom:1px solid var(--line); }
    #file-dialog-title { min-width:0; flex:1; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:600 14px/1.4 ui-monospace,monospace; }
    #file-dialog-close { width:34px; height:34px; border:0; border-radius:4px; background:transparent; cursor:pointer; font-size:22px; }
    #file-content { width:100%; height:calc(100% - 48px); margin:0; padding:16px; overflow:auto; white-space:pre; font:13px/1.55 ui-monospace,monospace; tab-size:4; }
    #file-image { display:block; max-width:100%; max-height:calc(100% - 48px); margin:auto; object-fit:contain; }
    button:disabled { opacity:.45; cursor:default; }
    @media (max-width:620px) { header { flex-wrap:wrap; } nav { order:3; width:100%; height:38px; } .tab { flex:1; } #settings { width:100%; } #project { width:150px; } #chat { grid-template-columns:150px minmax(0,1fr); } .message { max-width:92%; } }
  </style>

  const empty=data.projects.length===0; send.disabled=empty; prompt.disabled=empty; projectDelete.disabled=empty; projectRename.disabled=empty || busy;
  state.textContent=empty?'プロジェクトなし':'接続中';
  if(empty) { localStorage.removeItem('tege2dev.project'); messages.innerHTML='<div class="empty">プロジェクトがありません</div>'; fileTree.innerHTML='<div class="empty">ファイルがありません</div>'; }
  else await Promise.all([loadFileTree(),loadProjectHistory()]);
}
filesRefresh.addEventListener('click',loadFileTree);
filesUpload.addEventListener('click',()=>{ if(project.value && !busy) fileUploadInput.click(); });
function uploadProjectFiles(url,formData,onProgress) {
  return new Promise((resolve,reject)=>{
    const request=new XMLHttpRequest(); request.open('POST',url);
    request.upload.addEventListener('progress',event=>{ if(event.lengthComputable) onProgress(Math.round(event.loaded/event.total*100)); });
    request.addEventListener('load',()=>{
      if(request.status>=200 && request.status<300) resolve(request.responseText);
      else reject(new Error(request.responseText || `HTTP ${request.status}`));
    });
    request.addEventListener('error',()=>reject(new Error('通信に失敗しました')));
    request.addEventListener('abort',()=>reject(new Error('アップロードを中止しました')));
    request.send(formData);
  });
}
fileUploadInput.addEventListener('change',async()=>{
  if(!project.value || !fileUploadInput.files.length) return;
  filesUpload.disabled=true; projectRename.disabled=true; uploadProgress.value=0; uploadProgress.hidden=false; state.textContent='アップロード中 0%';
  const formData=new FormData(); for(const file of fileUploadInput.files) formData.append('file',file,file.name);
  try {
    const query=selectedUploadDirectory ? `?directory=${encodeURIComponent(selectedUploadDirectory)}` : '';
    await uploadProjectFiles(`/v1/projects/${encodeURIComponent(project.value)}/files${query}`,formData,percent=>{ uploadProgress.value=percent; state.textContent=`アップロード中 ${percent}%`; });
    await loadFileTree(); state.textContent='アップロード完了';
  } catch(error) { state.textContent=`アップロード失敗: ${error.message}`; }
  finally { fileUploadInput.value=''; uploadProgress.hidden=true; filesUpload.disabled=busy; projectRename.disabled=busy || !project.value; }
});
projectAdd.addEventListener('click',()=>{ renamingProject=null; projectDialog.querySelector('h2').textContent='プロジェクトを作成'; $('project-create').textContent='作成'; projectName.value=''; projectError.textContent=''; projectDialog.showModal(); projectName.focus(); });
projectRename.addEventListener('click',()=>{
  if(!project.value || busy) return;
  renamingProject=project.value; projectDialog.querySelector('h2').textContent='プロジェクト名を変更'; $('project-create').textContent='変更';
  projectName.value=renamingProject; projectError.textContent=''; projectDialog.showModal(); projectName.focus(); projectName.select();
});
$('project-cancel').addEventListener('click',()=>projectDialog.close());
$('project-create-form').addEventListener('submit',async event=>{
  event.preventDefault(); const name=projectName.value.trim(); if(!name) return;
  $('project-create').disabled=true; projectError.textContent='';
  try {
    if(busy) throw new Error('作業中はプロジェクト名を変更できません');
    const url=renamingProject ? `/v1/projects/${encodeURIComponent(renamingProject)}/rename` : '/v1/projects';
    const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
    if(!response.ok) { const data=await response.json().catch(()=>null); throw new Error(data?.error?.message || `HTTP ${response.status}`); }
    projectDialog.close(); resetNext=false; await loadProjects(name); prompt.focus();
  } catch(error) { projectError.textContent=error.message; }
  finally { $('project-create').disabled=false; }
});
projectDelete.addEventListener('click',()=>{
  if(!project.value || busy) return;
  projectDeleteMessage.textContent=`「${project.value}」のファイルと会話の紐付けを削除します。`;
  projectDeleteError.textContent=''; projectDeleteDialog.showModal();
});
$('project-delete-cancel').addEventListener('click',()=>projectDeleteDialog.close());
$('project-delete-confirm').addEventListener('click',async()=>{
  const name=project.value; if(!name) return;
  $('project-delete-confirm').disabled=true; projectDeleteError.textContent='';
  try {
    const response=await fetch(`/v1/projects/${encodeURIComponent(name)}`,{method:'DELETE'});
    if(!response.ok) { const data=await response.json().catch(()=>null); throw new Error(data?.error?.message || `HTTP ${response.status}`); }
    projectDeleteDialog.close(); localStorage.removeItem('tege2dev.project'); await loadProjects(); prompt.focus();
  } catch(error) { projectDeleteError.textContent=error.message; }
  finally { $('project-delete-confirm').disabled=false; }
});
function compactProject() {
  if(busy || !project.value || ws?.readyState!==WebSocket.OPEN) return;
  if(resetNext) { turnSummary('圧縮する会話履歴がありません'); return; }
  busy=true; compactionPending=true; steerReady=false; stop.disabled=false; setSendMode('working');
  project.disabled=true; projectAdd.disabled=true; projectRename.disabled=true; projectDelete.disabled=true; filesUpload.disabled=true;
  closeActivity(); closeAnswer();
  compactionLine=document.createElement('div'); compactionLine.className='turn-summary'; compactionLine.setAttribute('role','status'); compactionLine.textContent='整理中';
  messages.append(compactionLine); showThinkingIndicator(); scroll(); state.textContent='整理中';
  ws.send(JSON.stringify({sessionId:projectSession(),project:project.value,compact:true}));
}
stop.addEventListener('click',()=>{
  if(!busy || stop.disabled || ws?.readyState!==WebSocket.OPEN) return;
  stop.disabled=true; state.textContent='停止要求中';
  ws.send(JSON.stringify({type:'turn.interrupt'}));
});
$('form').addEventListener('submit', event => {
  event.preventDefault();
  hideCommandMenu();
  const text=prompt.value.trim();
  if(!text || !ws || ws.readyState!==WebSocket.OPEN) return;
  if(busy) {
    if(!steerReady || steerPending) return;
    steerPending=text; send.disabled=true; state.textContent='追加入力を送信中';
    ws.send(JSON.stringify({type:'turn.steer',text})); prompt.value=''; return;
  }
  if(text==='/new') {
    resetNext=true;
    messages.replaceChildren(); prompt.value=''; state.textContent='新しいセッション'; prompt.focus();
    return;
  }
  if(text==='/help') {
    bubble('agent','/new — 選択中のプロジェクトの会話をリセットします。ファイルは削除しません。\n/compact — 選択中のプロジェクトの会話を圧縮します。結果は履歴に残ります。\n/help — コマンド一覧を表示します。');
    prompt.value=''; prompt.focus(); return;
  }
  if(text==='/compact') {
    prompt.value=''; compactProject(); return;
  }
  bubble('user',text); busy=true; steerReady=false; stop.disabled=false; contextUsed=null; contextWindow=null; showThinkingIndicator(); setSendMode('working'); project.disabled=true; projectAdd.disabled=true; projectRename.disabled=true; projectDelete.disabled=true; filesUpload.disabled=true; prompt.value='';
  ws.send(JSON.stringify({sessionId:projectSession(),text,reset:resetNext,project:project.value})); resetNext=false;
});
prompt.addEventListener('input',updateCommandMenu);
prompt.addEventListener('blur',hideCommandMenu);
prompt.addEventListener('keydown',event=>{
  if(event.isComposing) return;
  if(event.key==='Enter' && event.ctrlKey) { event.preventDefault(); $('form').requestSubmit(); return; }
  if(!commandMenu.hidden) {
    if(event.key==='ArrowDown' || event.key==='ArrowUp') {
      event.preventDefault(); commandIndex=(commandIndex+(event.key==='ArrowDown'?1:-1)+commandMatches.length)%commandMatches.length; renderCommandMenu(); return;
    }
    if(event.key==='Escape') { event.preventDefault(); hideCommandMenu(); return; }
    if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); chooseCommand(commandIndex); return; }
  }
});
async function initialize() {
  try {
    await loadProjects();
    connect(); prompt.focus();
  } catch(error) { state.textContent=`初期化エラー: ${error.message}`; send.disabled=true; prompt.disabled=true; }
}
initialize();
</script>
</body>
</html>
